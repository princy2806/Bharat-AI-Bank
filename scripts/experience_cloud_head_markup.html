<style>

/* ════════════════════════════════════════════════════════

.siteHeroRegion,
.templateHero,

.forceCommunityHeroComponent,

}

════════════════════════════════════════════════════════ */
body,
.siteforceBody,
.siteContent,
.forceCommunityGlobalNavigation,
* {

════════════════════════════════════════════════════════ */

════════════════════════════════════════════════════════ */

.forceCommunityContentWrapper,

════════════════════════════════════════════════════════ */

    padding-top: 0 !important;
